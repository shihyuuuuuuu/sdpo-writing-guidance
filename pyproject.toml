[project]
name = "sdpo-feedback"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shihyuuuuuuu", email = "shihyuteng1997@gmail.com" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate",
    "bitsandbytes",
    "datasets==3.5.0",
    "pyarrow",
    "peft",
    "torch",
    "torchaudio",
    "torchvision",
    "vllm==0.19.1",
    "transformers>=5.20,<5.21",
    "setuptools",
    "matplotlib",
    "flash-linear-attention",
]

[project.scripts]
sdpo-feedback = "sdpo_feedback:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
